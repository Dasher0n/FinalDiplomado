name: sommelier

services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////srv/data/sommelier.db
      ARTEFACTOS_DIR: /srv/artefactos
      CORS_ORIGINS: http://localhost:4200,http://localhost:8080,http://127.0.0.1:8080
    volumes:
      - sommelier-data:/srv/data
      - ./artefactos:/srv/artefactos:ro
    ports:
      - "8000:8000"
    command: ["/bin/sh", "-c", "python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  sommelier-data:
