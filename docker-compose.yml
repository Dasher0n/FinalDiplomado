name: sommelier

services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////srv/data/sommelier.db
      ARTEFACTOS_DIR: /srv/artefactos
      CORS_ORIGINS: http://localhost:4200,http://localhost:8080,http://127.0.0.1:8080
    volumes:
      - sommelier-data:/srv/data
      - ./artefactos:/srv/artefactos:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  sommelier-data:
